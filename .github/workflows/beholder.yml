name: KrishaBeholder

on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут (по факту GitHub может задержать)
  workflow_dispatch: {}       # ручной запуск: первичное определение chat_id и проверка

# Не допускаем одновременных прогонов: иначе конфликт getUpdates (409)
# и гонка записи в gist.
concurrency:
  group: beholder
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Один цикл проверки
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_TG_USERNAME: ${{ vars.TARGET_TG_USERNAME }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          SEARCHES_PATH: searches.json
          STATE_PATH: data/state.json
          POLL_INTERVAL_S: ${{ vars.POLL_INTERVAL_S }}
          MAX_PAGES: ${{ vars.MAX_PAGES }}
          PAGE_DELAY_S: ${{ vars.PAGE_DELAY_S }}
        run: python -m app.main --once
