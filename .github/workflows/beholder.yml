name: KrishaBeholder

on:
  schedule:
    # Каждые 30 минут, но НЕ в :00/:30 — это самые загруженные слоты GitHub,
    # где scheduled-запуски чаще всего задерживаются и дропаются.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}       # ручной запуск для проверки

# Не допускаем одновременных прогонов: иначе конфликт getUpdates (409)
# и гонка записи в gist.
concurrency:
  group: beholder
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Один цикл проверки
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ vars.ADMIN_CHAT_ID }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          SEARCHES_JSON: ${{ vars.SEARCHES_JSON }}
          SEARCHES_PATH: searches.json
          STATE_PATH: data/state.json
          POLL_INTERVAL_S: ${{ vars.POLL_INTERVAL_S }}
          MAX_PAGES: ${{ vars.MAX_PAGES }}
          PAGE_DELAY_S: ${{ vars.PAGE_DELAY_S }}
        run: python -m app.main --once
